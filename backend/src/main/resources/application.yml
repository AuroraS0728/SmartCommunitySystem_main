spring:
  application:
    name: smart-community-backend
  profiles:
    active: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: smart-community-secret-key-1234567890
  expire-seconds: 86400

wechat:
  app-id: wx_mock_appid
  app-secret: mock_secret
  mch-id: mock_mch_id
  mch-serial-no: mock_serial_no
  api-v3-key: mock_api_v3_key
  notify-url: https://example.com/pay/notify

seetaface:
  enabled: ${SEETAFACE_ENABLED:true}
  detector-model-path: ${SEETAFACE_DETECTOR_MODEL:D:/Face/sf3.0_models/sf3.0_models/face_detector.csta}
  recognizer-model-path: ${SEETAFACE_RECOGNIZER_MODEL:D:/Face/sf3.0_models/sf3.0_models/face_recognizer.csta}
  landmarker-model-path: ${SEETAFACE_LANDMARKER_MODEL:D:/Face/sf3.0_models/sf3.0_models/face_landmarker_pts5.csta}
  similarity-threshold: ${SEETAFACE_THRESHOLD:0.7}
  enable-mask-check: ${SEETAFACE_ENABLE_MASK_CHECK:true}
  require-no-mask: ${SEETAFACE_REQUIRE_NO_MASK:true}
  enable-eye-state-check: ${SEETAFACE_ENABLE_EYE_STATE_CHECK:true}
  require-eyes-open: ${SEETAFACE_REQUIRE_EYES_OPEN:true}
  enable-quality-check: ${SEETAFACE_ENABLE_QUALITY_CHECK:true}
  require-quality-pass: ${SEETAFACE_REQUIRE_QUALITY_PASS:true}
  native-resource-dir: native
  native-extract-dir: ${SEETAFACE_NATIVE_EXTRACT:./seetaface-native}
  native-libraries:
    - tennis
    - tennis_haswell
    - tennis_pentium
    - tennis_sandy_bridge
    - SeetaAuthorize
    - SeetaMaskDetector200
    - SeetaEyeStateDetector200
    - SeetaQualityAssessor300
    - SeetaPoseEstimation600
    - SeetaFaceAntiSpoofingX600
    - SeetaFaceDetector600
    - SeetaFaceLandmarker600
    - SeetaFaceRecognizer610
    - SeetaFace6JNI

neighbor:
  default-page-size: 10
  max-page-size: 50
  sensitive-words:
    - 赌博
    - 诈骗
    - 涉黄
    - 毒品
    - 暴恐
